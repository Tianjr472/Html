<!DOCTYPE html>
<html lang="en">
<head>
    <nav class="quotes-nav">
        <a href="index.html" class="nav-home" aria-label="返回首页">← 回到首页</a>
    </nav>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Useless Door</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 50% 38%, #35404a 0, #202830 48%, #14191e 100%);
            color: #f5f1e9;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: 0.04em;
        }

        .intro {
            max-width: 420px;
            margin: 0 0 26px;
            color: #c6cbd0;
            line-height: 1.55;
        }

        .scene {
            position: relative;
            width: min(340px, calc(100vw - 52px));
            height: min(470px, 58vh);
            min-height: 350px;
            perspective: 1100px;
        }

        .door-frame {
            position: absolute;
            inset: 0;
            border: 14px solid #6d6254;
            border-bottom-width: 18px;
            border-radius: 8px 8px 2px 2px;
            background: #11171b;
            box-shadow:
                0 0 0 5px #302b26,
                0 24px 46px rgba(0, 0, 0, 0.5);
        }

        .door-frame::before {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #20282d, #101518 75%);
            content: "";
        }

        .door {
            position: absolute;
            z-index: 2;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            border: 0;
            border-radius: 2px;
            background:
                linear-gradient(90deg, transparent 0 8%, rgba(67, 31, 15, 0.18) 8.5% 9%, transparent 9.5%),
                repeating-linear-gradient(2deg, transparent 0 42px, rgba(255, 206, 153, 0.07) 43px, transparent 45px),
                linear-gradient(112deg, #a95d32, #754027 54%, #643722);
            box-shadow: inset 8px 0 12px rgba(255, 221, 181, 0.08),
                        inset -10px 0 18px rgba(35, 16, 8, 0.32);
            color: inherit;
            cursor: pointer;
            transform-origin: left center;
            transition: transform 500ms cubic-bezier(0.2, 0.7, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .door:focus-visible {
            outline: 4px solid #f5cc69;
            outline-offset: 7px;
        }

        .door::before,
        .door::after {
            position: absolute;
            right: 18px;
            left: 18px;
            border: 2px solid rgba(49, 24, 12, 0.45);
            border-radius: 4px;
            content: "";
            pointer-events: none;
        }

        .door::before {
            top: 24px;
            height: 34%;
        }

        .door::after {
            bottom: 24px;
            height: 32%;
        }

        .door-sign {
            position: relative;
            z-index: 1;
            min-width: 176px;
            padding: 12px 18px;
            border: 4px solid #d4bd8a;
            border-radius: 5px;
            background: linear-gradient(#f4e8c8, #d9c79e);
            box-shadow: 0 5px 10px rgba(35, 16, 8, 0.35);
            color: #30281c;
            font-size: clamp(2.6rem, 12vw, 3.6rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            line-height: 1.1;
            text-shadow: 0 1px rgba(255, 255, 255, 0.65);
        }

        .handle {
            position: absolute;
            top: 50%;
            right: 15px;
            z-index: 1;
            width: 16px;
            height: 58px;
            border: 2px solid #9e773d;
            border-radius: 12px;
            background: linear-gradient(90deg, #e4c47e, #9c7138);
            box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.4);
            transform: translateY(-50%);
        }

        .message-board {
            position: absolute;
            z-index: 3;
            top: 12px;
            right: -28px;
            width: min(150px, 45vw);
            padding: 13px 10px;
            border: 5px solid #8b633a;
            border-radius: 4px;
            background:
                repeating-linear-gradient(0deg, transparent 0 19px, rgba(255, 255, 255, 0.07) 20px),
                #eddfaF;
            box-shadow: 0 9px 18px rgba(0, 0, 0, 0.45);
            color: #33291e;
            font-size: 0.95rem;
            font-weight: 900;
            line-height: 1.35;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-115%) rotate(-3deg);
            transition: opacity 220ms ease, transform 380ms cubic-bezier(0.2, 0.7, 0.2, 1);
        }

        .scene.is-open .door {
            transform: rotateY(-16deg);
        }

        .scene.has-message .message-board {
            opacity: 1;
            transform: translateX(0) rotate(-3deg);
        }

        .status {
            min-height: 1.6em;
            margin: 22px 0 0;
            color: #e4d6b9;
            font-weight: 600;
        }

        .hint {
            margin: 8px 0 0;
            color: #aab1b7;
            font-size: 0.9rem;
        }

        @media (max-height: 620px) {
            body {
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .intro {
                margin-bottom: 16px;
            }

            .scene {
                height: 54vh;
                min-height: 300px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <h1>The Useless Door</h1>
    <p class="intro">The sign tells you what to do. Follow its advice and see what happens.</p>

    <div class="scene" id="scene">
        <div class="door-frame" aria-hidden="true"></div>
        <button class="door" id="door" type="button" aria-label="Push the door">
            <span class="door-sign" id="doorText">PUSH</span>
            <span class="handle" aria-hidden="true"></span>
        </button>
        <div class="message-board" id="messageBoard" aria-live="polite"></div>
    </div>

    <p class="status" id="status" aria-live="polite">Go ahead. Push the door.</p>
    <p class="hint">Click or tap the door to follow its sign.</p>

    <script>
        const scene = document.getElementById("scene");
        const door = document.getElementById("door");
        const doorText = document.getElementById("doorText");
        const messageBoard = document.getElementById("messageBoard");
        const status = document.getElementById("status");

        let nextAction = "PUSH";
        let isBusy = false;

        door.addEventListener("click", () => {
            if (isBusy) {
                return;
            }

            isBusy = true;
            door.disabled = true;
            scene.classList.remove("is-open", "has-message");

            const action = nextAction;
            const nextInstruction = action === "PUSH" ? "PULL" : "PUSH";
            status.textContent = `You ${action.toLowerCase()} the door...`;

            window.setTimeout(() => {
                messageBoard.textContent = `TRY TO ${nextInstruction}!`;
                scene.classList.add("is-open", "has-message");
                status.textContent = `The door opens a little. The board says: try to ${nextInstruction.toLowerCase()}!`;
            }, 180);

            window.setTimeout(() => {
                nextAction = nextInstruction;
                doorText.textContent = nextInstruction;
                door.setAttribute("aria-label", `${nextInstruction.toLowerCase()} the door`);
            }, 700);

            window.setTimeout(() => {
                scene.classList.remove("is-open", "has-message");
                status.textContent = `The door closes. Now it says ${nextInstruction.toLowerCase()}.`;
            }, 1700);

            window.setTimeout(() => {
                isBusy = false;
                door.disabled = false;
            }, 2200);
        });
    </script>
</body>
</html>
